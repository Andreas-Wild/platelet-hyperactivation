[project]
name = "platelet-hyperactivation"
version = "1.0.0"
description = "Statistical analysis for the platelet hyperactivation imaging flow cytometry study"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "scipy>=1.18.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# The scripts in src/ are run directly, not imported as a package; this lets
# `pip install .` install the dependencies without installing src/ modules
# under generic names such as `utils`.
[tool.setuptools]
py-modules = []
